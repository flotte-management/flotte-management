receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      scrape_configs:
        - job_name: "vehicle-service"
          metrics_path: /metrics
          static_configs:
            - targets: ["vehicle-service:8080"]
        - job_name: "driver-service"
          metrics_path: /metrics
          static_configs:
            - targets: ["driver-service:8000"]
        - job_name: "maintenance-service"
          metrics_path: /metrics
          static_configs:
            - targets: ["maintenance-service:8000"]
        - job_name: "mission-service"
          metrics_path: /metrics
          static_configs:
            - targets: ["mission-service:3005"]
        - job_name: "location-service"
          metrics_path: /metrics
          static_configs:
            - targets: ["location-service:3000"]

processors:
  batch:
  memory_limiter:
    check_interval: 1s
    limit_mib: 1000
    spike_limit_mib: 200

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger, debug]
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch]
      exporters: [prometheus, debug]
