apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fleet-ingress
  namespace: fleet-dev
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: fleet.local
      http:
        paths:
          - path: /about
            pathType: Prefix
            backend:
              service:
                name: frontend-about
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
          - path: /api/vehicles
            pathType: Prefix
            backend:
              service:
                name: vehicle-service
                port:
                  number: 8080
          - path: /api/drivers
            pathType: Prefix
            backend:
              service:
                name: driver-service
                port:
                  number: 8000
          - path: /api/maintenance
            pathType: Prefix
            backend:
              service:
                name: maintenance-service
                port:
                  number: 8000
          - path: /api/locations
            pathType: Prefix
            backend:
              service:
                name: location-service
                port:
                  number: 3000
          - path: /api/missions
            pathType: Prefix
            backend:
              service:
                name: mission-service
                port:
                  number: 3000
          - path: /api/events
            pathType: Prefix
            backend:
              service:
                name: event-service
                port:
                  number: 8080
    - host: keycloak.fleet.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
