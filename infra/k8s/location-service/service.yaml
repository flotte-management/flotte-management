apiVersion: v1
kind: Service
metadata:
  name: location-service
  namespace: fleet-dev
spec:
  selector:
    app: location-service
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
    - name: websocket
      protocol: TCP
      port: 3001
      targetPort: 3001
  type: ClusterIP