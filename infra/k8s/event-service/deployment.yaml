apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-service
  namespace: fleet-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-service
  template:
    metadata:
      labels:
        app: event-service
    spec:
      containers:
        - name: event-service
          image: event-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_BROKERS
              value: kafka:9092
          resources:
            requests:
              memory: "64Mi"    
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"