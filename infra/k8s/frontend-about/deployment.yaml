apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-about
  namespace: fleet-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-about
  template:
    metadata:
      labels:
        app: frontend-about
    spec:
      containers:
        - name: frontend-about
          image: frontend-about:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"

