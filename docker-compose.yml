services:
  postgres-vehicles:
    image: postgres:15-alpine
    container_name: postgres-vehicles
    environment:
      POSTGRES_DB: vehicles_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata_vehicles:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  postgres-drivers:
    image: postgres:15-alpine
    container_name: postgres-drivers
    environment:
      POSTGRES_DB: drivers_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - pgdata_drivers:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  postgres-location:
    image: timescale/timescaledb-ha:pg15
    container_name: postgres-location
    environment:
      POSTGRES_DB: location_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5434:5432"
    volumes:
      - pgdata_location:/var/lib/postgresql/data
      - ./services/location-service/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  postgres-maintenance:
    image: postgres:15-alpine
    container_name: postgres-maintenance
    environment:
      POSTGRES_DB: maintenance_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5435:5432"
    volumes:
      - pgdata_maintenance:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  postgres-mission:
    image: postgres:15-alpine
    container_name: postgres-mission
    environment:
      POSTGRES_DB: mission_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5436:5432"
    volumes:
      - pgdata_mission:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_secret
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: flotte-keycloak
    command: start-dev --import-realm # importe le realm au démarrage
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_secret
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      - keycloak-db

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test:
        [
          "CMD",
          "kafka-broker-api-versions",
          "--bootstrap-server",
          "localhost:9092",
        ]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [
        "/bin/bash",
        "-c",
        "
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 6  --replication-factor 1 --topic flotte.vehicules &&
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3  --replication-factor 1 --topic flotte.conducteurs &&
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3  --replication-factor 1 --topic flotte.maintenances &&
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 12 --replication-factor 1 --topic flotte.localisation &&
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 6  --replication-factor 1 --topic flotte.missions &&
        echo 'Topics créés avec succès'
        ",
      ]

  vehicle-service:
    build: ./services/vehicle-service
    container_name: vehicle-service
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-vehicles:5432/vehicles_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_SECURITY_ENABLED: "true"
      KEYCLOAK_REALM_URL: http://keycloak:8080/realms/flotte-management
      KEYCLOAK_CLIENT_ID: flotte-services
      KEYCLOAK_VERIFY_ISSUER: "false"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres-vehicles:
        condition: service_healthy
      kafka:
        condition: service_healthy

  driver-service:
    build: ./services/driver-service
    container_name: driver-service
    working_dir: /app
    command: >
      sh -c "python -m alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:secret@postgres-drivers:5432/drivers_db
      - DEBUG=True
      - SECRET_KEY=dev-secret-key
      - DB_HOST=postgres-drivers
      - DB_NAME=drivers_db
      - DB_USER=postgres
      - DB_PASSWORD=secret
      - KEYCLOAK_REALM_URL=http://keycloak:8080/realms/flotte-management
      - KEYCLOAK_CLIENT_ID=flotte-services
      - KEYCLOAK_VERIFY_ISSUER=false
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      postgres-drivers:
        condition: service_healthy
      kafka:
        condition: service_healthy

  location-service:
    build: ./services/location-service
    container_name: location-service
    ports:
      - "3003:3000"
      - "3004:3001"
    environment:
      - DB_HOST=postgres-location
      - DB_PORT=5432
      - DB_NAME=location_db
      - DB_USER=postgres
      - DB_PASSWORD=secret
      - KEYCLOAK_REALM_URL=http://keycloak:8080/realms/flotte-management
      - KEYCLOAK_VERIFY_ISSUER=false
      - DB_AUTO_BOOTSTRAP=true
      - GRPC_PORT=3001
      - AI_AGENT_ENABLED=true
      - KAFKA_ENABLED=true
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_TOPIC=flotte.localisation
      - KAFKA_GROUP_ID=location-service-group
    depends_on:
      postgres-location:
        condition: service_healthy
      kafka:
        condition: service_healthy

  event-service:
    build: ./services/event-service
    container_name: event-service
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: kafka:29092
    restart: unless-stopped
    #ports:
    # - "8003:8080"
    # environment:
    #  - KAFKA_BROKERS=kafka:9092
    #depends_on:
    # kafka:
    #  condition: service_started

  maintenance-service:
    build: ./services/maintenance-service
    container_name: maintenance-service
    ports:
      - "8001:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=dev-secret-key
      - DB_HOST=postgres-maintenance
      - DB_NAME=maintenance_db
      - DB_USER=postgres
      - DB_PASSWORD=secret
      - KEYCLOAK_REALM_URL=http://keycloak:8080/realms/flotte-management
      - KEYCLOAK_CLIENT_ID=flotte-services
      - KEYCLOAK_VERIFY_ISSUER=false
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      postgres-maintenance:
        condition: service_healthy
      kafka:
        condition: service_healthy

  mission-service:
    build: ./services/mission-service
    container_name: mission-service
    ports:
      - "3005:3005"
    environment:
      - DB_HOST=postgres-mission
      - DB_PORT=5432
      - DB_NAME=mission_db
      - DB_USER=postgres
      - DB_PASSWORD=secret
      - DB_SYNCHRONIZE=true
      - KEYCLOAK_REALM_URL=http://keycloak:8080/realms/flotte-management
      - KAFKA_ENABLED=true
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_GROUP_ID=mission-service-group
    depends_on:
      postgres-mission:
        condition: service_healthy
      kafka:
        condition: service_healthy

  gateway:
    build: ./gateway
    container_name: api-gateway
    ports:
      - "4000:4000"
    environment:
      GATEWAY_PORT: "4000"
      NODE_ENV: production
      VEHICLE_SERVICE_URL: http://vehicle-service:8080
      DRIVER_SERVICE_URL: http://driver-service:8000
      MAINTENANCE_SERVICE_URL: http://maintenance-service:8000
      MISSION_SERVICE_URL: http://mission-service:3005
      LOCATION_SERVICE_URL: http://location-service:3000
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: gateway-service
      KAFKA_GROUP_ID: gateway-group
      KEYCLOAK_REALM_URL: http://keycloak:8080/realms/flotte-management
      KEYCLOAK_CLIENT_ID: flotte-services
      KEYCLOAK_VERIFY_ISSUER: "false"
      CORS_ORIGIN: "http://localhost:5173,http://localhost:3000"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80" # On accède à l'app via http://localhost:5173
    container_name: flotte-frontend
    restart: unless-stopped

volumes:
  pgdata_vehicles:
  pgdata_drivers:
  pgdata_location:
  pgdata_maintenance:
  pgdata_mission:
  keycloak_db_data:
