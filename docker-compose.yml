services:

  postgres-vehicles:
    image: postgres:15-alpine
    container_name: postgres-vehicles
    environment:
      POSTGRES_DB: vehicles_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata_vehicles:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  postgres-drivers:
    image: postgres:15-alpine
    container_name: postgres-drivers
    environment:
      POSTGRES_DB: drivers_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - pgdata_drivers:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5
    
  
  postgres-location:
    image: postgres:15-alpine
    container_name: postgres-location
    environment:
      POSTGRES_DB: location_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5434:5432"            
    volumes:
      - pgdata_location:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5
  
  postgres-maintenance:
    image: postgres:15-alpine
    container_name: postgres-maintenance
    environment:
      POSTGRES_DB: maintenance_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5435:5432"             
    volumes:
      - pgdata_maintenance:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5
  
  postgres-mission:
    image: postgres:15-alpine
    container_name: postgres-mission
    environment:
      POSTGRES_DB: mission_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5436:5432"
    volumes:
      - pgdata_mission:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5


  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "2181" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092" ]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      kafka:
        condition: service_healthy
    # Crée les topics avec le bon nombre de partitions (§8.2 Table 14)
    entrypoint: [ "/bin/bash", "-c", "
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 6  --replication-factor 1 --topic flotte.vehicules &&
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3  --replication-factor 1 --topic flotte.conducteurs &&
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3  --replication-factor 1 --topic flotte.maintenances &&
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 12 --replication-factor 1 --topic flotte.localisation &&
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 6  --replication-factor 1 --topic flotte.missions &&
      echo 'Topics créés avec succès'
    " ]


  vehicle-service:
    build: ./services/vehicle-service
    container_name: vehicle-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-vehicles:5432/vehicles_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres-vehicles:
        condition: service_healthy

  driver-service:
    build: ./services/driver-service    
    container_name: driver-service
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=dev-secret-key
      - DB_HOST=postgres-drivers
      - DB_NAME=drivers_db
      - DB_USER=postgres
      - DB_PASSWORD=secret
      # - KAFKA_BOOTSTRAP_SERVERS=kafka:9092 
    depends_on:
      postgres-drivers:
        condition: service_healthy
  
  location-service:
    build: ./services/location-service
    container_name: location-service
    ports:
      - "3003:3000"            
      - "3004:3001"            
    environment:
      - DB_HOST=postgres-location
      - DB_PORT=5432
      - DB_NAME=location_db
      - DB_USER=postgres
      - DB_PASSWORD=secret
      #- KAFKA_BROKERS=kafka:9092
    depends_on:
      postgres-location:
        condition: service_healthy
      #kafka:
       # condition: service_started
  
  event-service:
    build: ./services/event-service
    container_name: event-service
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:29092
    restart: unless-stopped
    #ports:
     # - "8003:8080"
   # environment:
    #  - KAFKA_BROKERS=kafka:9092
    #depends_on:
     # kafka:
      #  condition: service_started
  
  maintenance-service:
    build: ./services/maintenance-service
    container_name: maintenance-service
    ports:
      - "8001:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=dev-secret-key
      - DB_HOST=postgres-maintenance
      - DB_NAME=maintenance_db
      - DB_USER=postgres
      - DB_PASSWORD=secret
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      postgres-maintenance:
        condition: service_healthy
      #kafka:
       # condition: service_started
  
  mission-service:
    build: ./services/mission-service
    container_name: mission-service
    ports:
      - "3005:3000"
    environment:  
      - DB_HOST=postgres-mission
      - DB_PORT=5432
      - DB_NAME=mission_db
      - DB_USER=postgres
      - DB_PASSWORD=secret
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      postgres-mission:
        condition: service_healthy
     # kafka:
      #  condition: service_started

volumes:
  pgdata_vehicles:
  pgdata_drivers:
  pgdata_location:
  pgdata_maintenance:
  pgdata_mission: